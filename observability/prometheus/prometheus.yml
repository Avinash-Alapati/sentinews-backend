global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    app: sentinews
    env: load-test

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: sentinews-api
    scheme: https
    metrics_path: /internal/metrics
    scrape_timeout: 10s
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ["<your-service>.onrender.com"]
        labels:
          service: api

  - job_name: sentinews-api-compose
    scheme: http
    metrics_path: /internal/metrics
    scrape_timeout: 10s
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ["api:8000", "host.docker.internal:8000"]
        labels:
          service: api

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

