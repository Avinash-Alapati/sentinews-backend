name: CI/CD Pipeline - Test & Auto-Deploy to AWS EC2

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Test Suite & Database Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: sentinews
          POSTGRES_PASSWORD: testpassword123
          POSTGRES_DB: sentinews_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinews -d sentinews_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: .
      ENVIRONMENT: test
      SECRET_KEY: test_super_secret_jwt_key_here_for_ci_pipeline_verification
      METRICS_TOKEN: test_metrics_token_32_bytes_length_here_ok
      INTERNAL_API_SECRET: test_internal_secret_key_32_bytes_length_ok
      DATABASE_URL: postgresql+asyncpg://sentinews:testpassword123@localhost:5432/sentinews_test
      SYNC_DATABASE_URL: postgresql://sentinews:testpassword123@localhost:5432/sentinews_test
      REDIS_URL: redis://localhost:6379/0
      REDIS_BROKER_URL: redis://localhost:6379/0
      REDIS_ENABLED: "true"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies & Python Packages
        run: |
          sudo apt-get update && sudo apt-get install -y libpq-dev
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify Alembic Database Migrations
        run: |
          echo "Testing Alembic migration upgrade against PostgreSQL 15..."
          alembic upgrade head

      - name: Run Pytest Test Suite
        run: |
          pytest -v --tb=short

  deploy:
    name: Auto-Deploy to AWS EC2 via SSM
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}

      - name: Trigger EC2 Deployment via AWS Systems Manager (SSM)
        env:
          EC2_INSTANCE_ID: ${{ secrets.AWS_EC2_INSTANCE_ID || 'i-061620e648e4deb54' }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}
        run: |
          echo "[INFO] Triggering auto-deployment on EC2 instance ${EC2_INSTANCE_ID} in ${AWS_REGION}..."

          # Send SSM Command to execute deploy_on_ec2.sh
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["git config --global --add safe.directory /opt/sentinews && cd /opt/sentinews && git fetch origin master && git reset --hard origin/master && chmod +x scripts/deploy_on_ec2.sh && bash scripts/deploy_on_ec2.sh"]' \
            --region "${AWS_REGION}" \
            --query "Command.CommandId" \
            --output text)

          echo "[INFO] Dispatched SSM command ID: ${COMMAND_ID}"
          echo "[INFO] Streaming execution logs from EC2..."

          # Poll status until command reaches a terminal state
          STATUS="Pending"
          for i in {1..70}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --region "${AWS_REGION}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            if [ "${STATUS}" = "Success" ] || [ "${STATUS}" = "Failed" ] || [ "${STATUS}" = "Cancelled" ] || [ "${STATUS}" = "TimedOut" ]; then
              break
            fi
            echo "Waiting for EC2 deployment... Status: ${STATUS} (${i}/70)"
            sleep 5
          done

          # Fetch and display full output
          INVOCATION=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --region "${AWS_REGION}" \
            --output json)

          echo "==================== EC2 STDOUT ===================="
          echo "${INVOCATION}" | jq -r '.StandardOutputContent // empty'
          echo "==================== EC2 STDERR ===================="
          echo "${INVOCATION}" | jq -r '.StandardErrorContent // empty'
          echo "===================================================="

          if [ "${STATUS}" != "Success" ]; then
            echo "[ERROR] Deployment failed with status: ${STATUS}"
            exit 1
          fi

          echo "[SUCCESS] EC2 deployment finished successfully."

      - name: Verify Live Public Endpoint
        run: |
          echo "[INFO] Verifying live public endpoint https://api.13.54.138.191.nip.io/healthz..."
          for i in {1..12}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.13.54.138.191.nip.io/healthz || echo "000")
            if [ "${HTTP_STATUS}" = "200" ]; then
              echo "[SUCCESS] Public health check verified: HTTP 200 OK!"
              exit 0
            fi
            echo "Waiting for public endpoint to respond 200... (got ${HTTP_STATUS}, attempt ${i}/12)"
            sleep 5
          done
          echo "[ERROR] Public endpoint did not respond with HTTP 200 within timeout."
          exit 1
